name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tpt
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: tpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The store contract tests run against this PostgreSQL service as well as SQLite.
      TPT_TEST_POSTGRES_DSN: postgres://tpt:testpass@localhost:5432/tpt?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/tpt-identity/...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
