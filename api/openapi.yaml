webhooks:
  webhookEvent:
    post:
      tags: [Webhooks]
      operationId: webhookEvent
      summary: Event delivered to a subscribed URL
      description: |
        Your server receives this POST. Verify `X-TPT-Signature-256`, which is
        `sha256=` followed by the hex HMAC-SHA256 of the raw body, keyed with the
        `signing_secret` returned when you subscribed.

        Event types: `credential.issued`, `credential.revoked`, `consent.granted`,
        `consent.revoked`, `identity.created`, `session.created`, `session.revoked`,
        `consent.expiring_soon`, `recovery.initiated`, `recovery.approved`, `session.duress`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type:
                  type: string
                data:
                  type: object
                  additionalProperties: true
      responses:
        "2XX":
          description: Acknowledged.
