openapi: 3.1.0
info:
  title: tpt-identity API
  version: 0.1.0
  summary: Self-sovereign identity, verifiable credentials and OIDC provider.
  description: |
    HTTP API for the tpt-identity server. The server is an OIDC provider, a DID
    resolver, a verifiable-credential issuer and verifier (W3C DataIntegrityProof
    and SD-JWT), and a consent and audit service.

    Authentication comes in three forms:

    * **apiKey**: `Authorization: Bearer <api_key>` from the server config. Used by
      platform-to-platform routes such as issuing credentials and admin calls.
    * **userBearer**: an OIDC access token issued by `/token`. Used by `/api/v1/me/*`.
    * **clientBasic**: client credentials (`client_secret_basic`) on `/token`,
      `/oauth/introspect` and `/oidc/revoke`.

    Relying parties must register with `POST /oidc/register` (requires apiKey)
    before they can use `/authorize`. `/authorize` requires both `state` and a
    PKCE `code_challenge` (S256).

    Routes not listed under a security scheme are public. Some of these are
    browser redirects and are documented with `302` responses.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: "{issuer}"
    description: The server's canonical `issuer` URL from config.
    variables:
      issuer:
        default: https://identity.example.com
tags:
  - name: OIDC
  - name: Well-known
  - name: OID4VCI
  - name: OID4VP
  - name: Device
  - name: Bridge
  - name: Credentials
  - name: Consents
  - name: Me
  - name: Webhooks
  - name: Audit
  - name: Marketplace
  - name: Recovery
  - name: Presentations
  - name: Admin
  - name: WebAuthn
  - name: Ops
  - name: DIDComm
  - name: Spec
security: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: The server's `api_key` from config.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token from `/token`.
    clientBasic:
      type: http
      scheme: basic
      description: Client ID and secret (`client_secret_basic`).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Did:
      name: did
      in: path
      required: true
      description: A DID, for example `did:web:example.com`.
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Authenticated, but not allowed (for example, no consent grant).
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: The resource does not exist.
      content:
        text/plain:
          schema:
            type: string
    TooManyRequests:
      description: Rate limit exceeded for this client IP.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        text/plain:
          schema:
            type: string
    Redirect:
      description: Browser redirect to the next step of the flow.
      headers:
        Location:
          schema:
            type: string
            format: uri
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string

    # --- Identity ---
    CreateIdentityRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [web, key, peer]
        domain:
          type: string
          description: Required for `did:web`.
    CreateIdentityResponse:
      type: object
      properties:
        did:
          type: string
        document:
          type: object
          additionalProperties: true
        private_keys:
          type: object
          properties:
            ed25519_seed:
              type: string
            x25519_private:
              type: string
        warning:
          type: string
    Identity:
      type: object
      additionalProperties: true
      properties:
        did:
          type: string
        document:
          type: object
          additionalProperties: true

    # --- Credentials ---
    IssueCredentialRequest:
      type: object
      required: [subject_did, schema_id, claims]
      properties:
        issuer_did:
          type: string
        subject_did:
          type: string
        schema_id:
          type: string
          example: identity.legal-name
        claims:
          type: object
          additionalProperties:
            type: string
        valid_for:
          type: string
          description: Go duration, for example `8760h`. Negative values produce an already-expired credential.
          example: 8760h
        status_list_credential:
          type: string
          format: uri
        status_list_index:
          type: integer
    VerifiableCredential:
      type: object
      description: W3C Verifiable Credential with a DataIntegrityProof (eddsa-jcs-2022).
      additionalProperties: true
      properties:
        "@context":
          type: array
          items: {}
        type:
          type: array
          items:
            type: string
        issuer:
          type: string
        credentialSubject:
          type: object
          additionalProperties: true
        proof:
          type: object
          additionalProperties: true
    VerifyCredentialResponse:
      type: object
      additionalProperties: true
      properties:
        valid:
          type: boolean
        error:
          type: string
    BatchIssueRequest:
      type: object
      description: A list of credential issuance requests, issued in one call.
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/IssueCredentialRequest"
    BatchIssueResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              credential:
                $ref: "#/components/schemas/VerifiableCredential"
              error:
                type: string
    SDJWTIssueRequest:
      type: object
      required: [subject_did, selective_claims]
      properties:
        issuer_did:
          type: string
        subject_did:
          type: string
        schema_id:
          type: string
        selective_claims:
          type: object
          additionalProperties: true
        always_visible_claims:
          type: object
          additionalProperties: true
        valid_for:
          type: string
          example: 8760h
        return_format:
          type: string
          description: Set to `serialized` to return the SD-JWT as a single string.
    SDJWTToken:
      type: object
      properties:
        jwt:
          type: string
        disclosures:
          type: array
          items:
            $ref: "#/components/schemas/Disclosure"
        serialized:
          type: string
          description: Present only when `return_format` is `serialized`.
    Disclosure:
      type: object
      properties:
        key:
          type: string
        encoded:
          type: string
          description: base64url of `[salt, key, value]`.
    SDJWTVerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        expected_nonce:
          type: string
        expected_audience:
          type: string
    SDJWTVerifyResponse:
      type: object
      properties:
        valid:
          type: boolean
        issuer_did:
          type: string
        subject_did:
          type: string
        schema_id:
          type: string
        disclosed_claims:
          type: object
          additionalProperties: true
        always_claims:
          type: object
          additionalProperties: true
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        key_binding_verified:
          type: boolean
        error:
          type: string
    SDJWTPresentRequest:
      type: object
      description: Holder-side presentation. Reveals only the named disclosures.
      properties:
        sd_jwt:
          type: string
        reveal_keys:
          type: array
          items:
            type: string
        verifier_did:
          type: string
    AgeProofRequest:
      type: object
      properties:
        sd_jwt:
          type: string
        reveal_keys:
          type: array
          items:
            type: string
        verifier_did:
          type: string
    CredentialFreshness:
      type: object
      additionalProperties: true

    # --- Consent ---
    CreateGrantRequest:
      type: object
      required: [relyingDid, level, scopeId, explicitlyConfirmed]
      properties:
        relyingDid:
          type: string
        level:
          type: string
          description: Grant level (`category` or `individual`).
        scopeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        explicitlyConfirmed:
          type: boolean
          description: Required for extra-sensitive schemas such as mental-health or criminal-record.
    SubmitReceiptRequest:
      type: object
      required: [subject_did, relying_did, schema_id, legal_basis]
      properties:
        subject_did:
          type: string
        relying_did:
          type: string
        schema_id:
          type: string
        legal_basis:
          type: string
        purpose:
          type: string
        expires_at:
          type: string
          format: date-time
    Schema:
      type: object
      additionalProperties: true
      description: A credential schema from the registry.

    # --- OIDC ---
    DiscoveryDocument:
      type: object
      additionalProperties: true
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
        registration_endpoint:
          type: string
        introspection_endpoint:
          type: string
        revocation_endpoint:
          type: string
        backchannel_logout_supported:
          type: boolean
        grant_types_supported:
          type: array
          items:
            type: string
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
                example: OKP
              crv:
                type: string
                example: Ed25519
              x:
                type: string
              use:
                type: string
              alg:
                type: string
              kid:
                type: string
    RegisterClientRequest:
      type: object
      required: [client_name, redirect_uris]
      properties:
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        token_endpoint_auth_method:
          type: string
          enum: [none, client_secret_basic, client_secret_post]
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string
        backchannel_logout_uri:
          type: string
          format: uri
        post_logout_redirect_uris:
          type: array
          items:
            type: string
            format: uri
    RegisteredClient:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
          description: Returned once, only when the auth method uses a secret.
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        backchannel_logout_uri:
          type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        client_id_issued_at:
          type: integer
          format: int64
    TokenRequest:
      type: object
      description: Form-encoded. Use `grant_type` to select the flow.
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token, client_credentials, urn:ietf:params:oauth:grant-type:device_code]
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
        refresh_token:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
        device_code:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        id_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
          description: Rotated on every use. Omitted for `client_credentials`.
        scope:
          type: string
    IntrospectionResponse:
      type: object
      properties:
        active:
          type: boolean
        sub:
          type: string
        client_id:
          type: string
        scope:
          type: string
        iat:
          type: integer
        exp:
          type: integer
        iss:
          type: string
        token_type:
          type: string
    LogoutToken:
      type: object
      description: Back-channel logout token (`events` claim with the logout event), POSTed to `backchannel_logout_uri`.
      additionalProperties: true
    PARRequest:
      type: object
      description: Form-encoded authorization request, as for `/authorize`.
      additionalProperties: true
    PARResponse:
      type: object
      properties:
        request_uri:
          type: string
        expires_in:
          type: integer
    StepUpRequest:
      type: object
      additionalProperties: true
      properties:
        acr_values:
          type: string
    DeviceAuthorizationResponse:
      type: object
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
          format: uri
        verification_uri_complete:
          type: string
          format: uri
        expires_in:
          type: integer
        interval:
          type: integer
    DeviceApproveRequest:
      type: object
      required: [user_code]
      properties:
        user_code:
          type: string

    # --- OID4VCI / OID4VP ---
    CredentialOfferRequest:
      type: object
      required: [subject_did, schema_ids, client_id]
      properties:
        subject_did:
          type: string
        schema_ids:
          type: array
          items:
            type: string
        client_id:
          type: string
        expires_in:
          type: integer
    CredentialOffer:
      type: object
      additionalProperties: true
      description: OID4VCI credential offer object.
    OID4VCICredentialRequest:
      type: object
      properties:
        format:
          type: string
          enum: [jwt_vc_json, ldp_vc, vc+sd-jwt]
        credential_definition:
          type: object
          properties:
            type:
              type: array
              items:
                type: string
        vct:
          type: string
          description: SD-JWT VCT claim (for the `vc+sd-jwt` format).
        proof:
          type: object
          properties:
            proof_type:
              type: string
              example: jwt
            jwt:
              type: string
    OID4VCICredentialResponse:
      type: object
      additionalProperties: true
      properties:
        credential:
          type: string
        format:
          type: string
    VPRequestCreate:
      type: object
      required: [client_id, presentation_definition]
      properties:
        client_id:
          type: string
        presentation_definition:
          type: object
          additionalProperties: true
          description: DIF Presentation Exchange v2 definition.
        expires_in:
          type: integer
        response_mode:
          type: string
          enum: [direct_post, direct_post.jwt]
    VPRequest:
      type: object
      properties:
        id:
          type: string
        client_id:
          type: string
        response_type:
          type: string
          example: vp_token
        response_mode:
          type: string
          example: direct_post
        response_uri:
          type: string
          format: uri
        nonce:
          type: string
        presentation_definition:
          type: object
          additionalProperties: true
        state:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    VPResponsePost:
      type: object
      required: [request_id, vp_token]
      properties:
        request_id:
          type: string
        vp_token:
          type: string
          description: JSON-encoded VP or a JWT.
        state:
          type: string
    VPResponse:
      type: object
      properties:
        request_id:
          type: string
        vp_token:
          type: string
        state:
          type: string
        received_at:
          type: string
          format: date-time
        error:
          type: string

    # --- Presentation Exchange ---
    PresentationRequestCreate:
      type: object
      required: [presentation_definition]
      properties:
        presentation_definition:
          type: object
          additionalProperties: true
        domain:
          type: string
    PresentationRequest:
      type: object
      properties:
        request_id:
          type: string
        nonce:
          type: string
        presentation_definition:
          type: object
          additionalProperties: true
        expires_at:
          type: string
    PresentationSubmitRequest:
      type: object
      required: [request_id, presentation, submission]
      properties:
        request_id:
          type: string
        presentation:
          type: object
          additionalProperties: true
          description: Verifiable presentation.
        submission:
          type: object
          additionalProperties: true
          description: DIF Presentation Submission.

    # --- Webhooks ---
    CreateWebhookRequest:
      type: object
      required: [url, event_types]
      properties:
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
            enum:
              - credential.issued
              - credential.revoked
              - consent.granted
              - consent.revoked
              - identity.created
              - session.created
              - session.revoked
              - session.duress
              - consent.expiring_soon
              - recovery.initiated
              - recovery.approved
    Webhook:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
        signing_secret:
          type: string
          description: Returned only on creation. Store it safely.
        created_at:
          type: string
          format: date-time

    # --- Credentials admin ---
    WebAuthnCredential:
      type: object
      properties:
        credential_id:
          type: string
        name:
          type: string
        transports:
          type: array
          items:
            type: string
        attestation_type:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time

    # --- Auth bridge (password, magic link, TOTP, duress) ---
    PasswordAuthRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
        scope:
          type: string
        state:
          type: string
        nonce:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          format: password
    PasswordResetRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
    PasswordResetConfirm:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
    MagicLinkRequest:
      type: object
      required: [email, client_id, redirect_uri, scope, nonce]
      properties:
        email:
          type: string
          format: email
        client_id:
          type: string
        redirect_uri:
          type: string
        scope:
          type: string
        nonce:
          type: string
    TOTPEnrolRequest:
      type: object
      properties:
        account_name:
          type: string
    TOTPVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    DuressEnrolRequest:
      type: object
      required: [duress_passphrase]
      properties:
        duress_passphrase:
          type: string
          format: password

    # --- Recovery ---
    RecoveryEnrolRequest:
      type: object
      required: [guardian_dids, threshold]
      properties:
        guardian_dids:
          type: array
          items:
            type: string
        threshold:
          type: integer
          minimum: 1
    RecoveryInitiateRequest:
      type: object
      required: [subject_did]
      properties:
        subject_did:
          type: string
    RecoveryApproveRequest:
      type: object
      required: [share]
      properties:
        share:
          type: string
          description: Hex-encoded Shamir share, as delivered to the guardian.
    Recovery:
      type: object
      additionalProperties: true

    # --- Privacy ---
    PrivacyBudget:
      type: object
      properties:
        schema_id:
          type: string
        total_shares:
          type: integer
        unique_verifiers:
          type: integer
        last_shared_at:
          type: string
          format: date-time
        verifier_counts:
          type: object
          additionalProperties:
            type: integer
    RecordDisclosureRequest:
      type: object
      required: [subject_did, schema_id, verifier_did, field_names]
      properties:
        subject_did:
          type: string
        schema_id:
          type: string
        verifier_did:
          type: string
        field_names:
          type: array
          items:
            type: string

    # --- Admin ---
    AdminStats:
      type: object
      additionalProperties: true
    AdminClient:
      type: object
      additionalProperties: true

    # --- Ops ---
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              error:
                type: string

    # --- WebAuthn ---
    WebAuthnCreationOptions:
      type: object
      additionalProperties: true
      description: WebAuthn `PublicKeyCredentialCreationOptions` (or request options on login).
    WebAuthnCredentialResponse:
      type: object
      additionalProperties: true
      description: WebAuthn `PublicKeyCredential` response from the browser.

    # --- DIDComm ---
    DIDCommEnvelope:
      type: object
      description: DIDComm v2 JWE JSON serialization (anoncrypt or authcrypt).
      additionalProperties: true
    DIDCommReceipt:
      type: object
      properties:
        message_id:
          type: string
        type:
          type: string

    # --- Misc ---
    JSONObject:
      type: object
      additionalProperties: true

paths:
  # ── DIDComm ──────────────────────────────────────────────────────────────
  /didcomm:
    post:
      tags: [DIDComm]
      operationId: didcommReceive
      summary: Receive a DIDComm v2 message
      description: Decrypts a JWE envelope with the platform X25519 key. Public, because the envelope is encrypted.
      requestBody:
        required: true
        content:
          application/didcomm-encrypted+json:
            schema:
              $ref: "#/components/schemas/DIDCommEnvelope"
      responses:
        "202":
          description: Message accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DIDCommReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Well-known and discovery ─────────────────────────────────────────────
  /.well-known/openid-configuration:
    get:
      tags: [Well-known]
      operationId: getOpenIDConfiguration
      summary: OIDC discovery document
      responses:
        "200":
          description: Discovery metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryDocument"
  /.well-known/oauth-authorization-server:
    get:
      tags: [Well-known]
      operationId: getOAuthAuthorizationServerMetadata
      summary: OAuth 2.0 authorization server metadata (RFC 8414); same document as the OIDC discovery
      responses:
        "200":
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryDocument"
  /.well-known/jwks.json:
    get:
      tags: [Well-known]
      operationId: getJWKS
      summary: Public signing keys (EdDSA / Ed25519)
      responses:
        "200":
          description: JWK set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
  /.well-known/did.json:
    get:
      tags: [Well-known]
      operationId: getPlatformDIDDocument
      summary: Platform DID document (did:web)
      responses:
        "200":
          description: DID document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /.well-known/webfinger:
    get:
      tags: [Well-known]
      operationId: webfinger
      summary: WebFinger lookup
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JRD document.
          content:
            application/jrd+json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /.well-known/openid-credential-issuer:
    get:
      tags: [Well-known, OID4VCI]
      operationId: getCredentialIssuerMetadata
      summary: OID4VCI credential issuer metadata
      responses:
        "200":
          description: Issuer metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ── OIDC ─────────────────────────────────────────────────────────────────
  /authorize:
    get:
      tags: [OIDC]
      operationId: authorize
      summary: Start an authorization-code flow
      description: |
        `state` (CSRF) and `code_challenge` (PKCE S256) are both mandatory.
        `client_id` must be registered via `/oidc/register` first.
        Redirects to the login page, then back to `redirect_uri` with `code` and `state`.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: scope
          in: query
          required: true
          schema:
            type: string
            example: openid profile
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: nonce
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: request_uri
          in: query
          description: Use a request from `POST /oidc/par`.
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /token:
    post:
      tags: [OIDC]
      operationId: token
      summary: Exchange a grant for tokens
      description: Supports authorization_code, refresh_token, client_credentials and device_code.
      security:
        - clientBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /userinfo:
    get:
      tags: [OIDC]
      operationId: userinfo
      summary: Claims for the access token's subject
      security:
        - userBearer: []
      responses:
        "200":
          description: User claims.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /oidc/register:
    post:
      tags: [OIDC]
      operationId: registerClient
      summary: Register a relying party (RFC 7591)
      description: Requires apiKey. Relying parties must be registered before `/authorize` accepts their `client_id`.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterClientRequest"
      responses:
        "201":
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oidc/revoke:
    post:
      tags: [OIDC]
      operationId: revokeToken
      summary: Revoke an access or refresh token (RFC 7009)
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        "200":
          description: Revoked (or already invalid).
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oauth/introspect:
    post:
      tags: [OIDC]
      operationId: introspectToken
      summary: Introspect a token (RFC 7662)
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Introspection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oidc/logout:
    get:
      tags: [OIDC]
      operationId: logout
      summary: RP-initiated logout
      parameters:
        - name: id_token_hint
          in: query
          schema:
            type: string
        - name: post_logout_redirect_uri
          in: query
          schema:
            type: string
            format: uri
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oidc/par:
    post:
      tags: [OIDC]
      operationId: pushAuthorizationRequest
      summary: Push an authorization request (RFC 9126)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PARRequest"
      responses:
        "201":
          description: Request stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PARResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oidc/stepup:
    post:
      tags: [OIDC]
      operationId: stepUp
      summary: Request step-up authentication (RFC 9470)
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequest"
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Device flow (RFC 8628) ───────────────────────────────────────────────
  /device_authorization:
    post:
      tags: [Device]
      operationId: deviceAuthorization
      summary: Start a device authorization
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
                scope:
                  type: string
      responses:
        "200":
          description: Device and user codes issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /device:
    get:
      tags: [Device]
      operationId: deviceVerify
      summary: Device verification page
      parameters:
        - name: user_code
          in: query
          schema:
            type: string
      responses:
        "200":
          description: HTML verification page.
          content:
            text/html:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /device/approve:
    post:
      tags: [Device]
      operationId: deviceApprove
      summary: Approve a device login
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
      responses:
        "200":
          description: Device approved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── OID4VCI ──────────────────────────────────────────────────────────────
  /oid4vci/offers:
    post:
      tags: [OID4VCI]
      operationId: createCredentialOffer
      summary: Create a credential offer
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialOfferRequest"
      responses:
        "201":
          description: Offer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialOffer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oid4vci/credential:
    post:
      tags: [OID4VCI]
      operationId: getCredentialByProof
      summary: Redeem an offer and receive a credential
      description: The wallet presents the pre-authorized code and a key proof JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OID4VCICredentialRequest"
      responses:
        "200":
          description: Credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OID4VCICredentialResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── OID4VP ───────────────────────────────────────────────────────────────
  /oid4vp/requests:
    post:
      tags: [OID4VP]
      operationId: createVPRequest
      summary: Create a presentation request (verifier)
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VPRequestCreate"
      responses:
        "201":
          description: Request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oid4vp/requests/{id}:
    get:
      tags: [OID4VP]
      operationId: getVPRequest
      summary: Fetch a presentation request (wallet)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Presentation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oid4vp/responses:
    post:
      tags: [OID4VP]
      operationId: postVPResponse
      summary: Wallet submits a presentation (direct_post)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VPResponsePost"
      responses:
        "202":
          description: Response stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /oid4vp/responses/{id}:
    get:
      tags: [OID4VP]
      operationId: getVPResponse
      summary: Fetch a stored presentation response (verifier)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Stored response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Ops ──────────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Ops]
      operationId: liveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is up.
  /readyz:
    get:
      tags: [Ops]
      operationId: readiness
      summary: Readiness probe (checks the store)
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /metrics:
    get:
      tags: [Ops]
      operationId: metrics
      summary: Prometheus metrics
      security:
        - apiKey: []
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /openapi.yaml:
    get:
      tags: [Spec]
      operationId: getOpenAPISpec
      summary: This OpenAPI document
      responses:
        "200":
          description: The OpenAPI document for this server version.
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/status/{listId}:
    get:
      tags: [Credentials]
      operationId: getStatusList
      summary: Credential status list (public, for verifiers)
      parameters:
        - name: listId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status list credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiableCredential"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Bridge (browser-based sign-in) ───────────────────────────────────────
  /auth/{provider}:
    get:
      tags: [Bridge]
      operationId: bridgeStart
      summary: Start sign-in with an external provider
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          schema:
            type: string
        - name: nonce
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
        - name: code_challenge_method
          in: query
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/{provider}/callback:
    get:
      tags: [Bridge]
      operationId: bridgeCallback
      summary: Callback from the external provider
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/{provider}/metadata:
    get:
      tags: [Bridge]
      operationId: samlMetadata
      summary: SAML 2.0 service provider metadata
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: SAML SP metadata XML.
          content:
            application/xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/{provider}/acs:
    post:
      tags: [Bridge]
      operationId: samlAssertionConsumer
      summary: SAML assertion consumer service
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                RelayState:
                  type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password:
    post:
      tags: [Bridge]
      operationId: passwordAuth
      summary: Sign in with identifier and password
      description: Returns a redirect that carries the authorization code. A duress passphrase signs in normally but fires a silent `session.duress` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordAuthRequest"
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/magiclink/request:
    post:
      tags: [Bridge]
      operationId: magicLinkRequest
      summary: Email a sign-in link
      description: The link expires after 15 minutes and is single-use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "202":
          description: Email sent if the address is known.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/magiclink/verify:
    get:
      tags: [Bridge]
      operationId: magicLinkVerify
      summary: Redeem a magic link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/change:
    post:
      tags: [Bridge]
      operationId: changePassword
      summary: Change password
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/reset/request:
    post:
      tags: [Bridge]
      operationId: requestPasswordReset
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Sent if the account exists.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/reset/confirm:
    post:
      tags: [Bridge]
      operationId: confirmPasswordReset
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: Password reset.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Identities ───────────────────────────────────────────────────────────
  /api/v1/identities:
    post:
      tags: [Credentials]
      operationId: createIdentity
      summary: Create a platform identity (DID)
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityRequest"
      responses:
        "201":
          description: Identity created. Private keys are returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateIdentityResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/identities/{did}:
    get:
      tags: [Credentials]
      operationId: getIdentity
      summary: Get an identity
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Did"
      responses:
        "200":
          description: Identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── Credentials ──────────────────────────────────────────────────────────
  /api/v1/credentials:
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List credentials
      security:
        - apiKey: []
      parameters:
        - name: subject_did
          in: query
          schema:
            type: string
        - name: schema_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerifiableCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Credentials]
      operationId: issueCredential
      summary: Issue a W3C verifiable credential
      description: Signed with the platform key. `did:key` is rejected as issuer.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCredentialRequest"
      responses:
        "201":
          description: Credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiableCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/credentials/verify:
    post:
      tags: [Credentials]
      operationId: verifyCredential
      summary: Verify a W3C verifiable credential
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiableCredential"
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyCredentialResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/credentials/{id}:
    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: Delete a credential
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
